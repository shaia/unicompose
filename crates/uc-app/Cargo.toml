tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uc-engine.workspace = true
uc-hid.workspace = true
uc-codec.workspace = true
uc-config.workspace = true
uc-platform.workspace = true
uc-xcompose.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
uc-win.workspace = true

[build-dependencies]
winresource.workspace = true

[lints]
workspace = true
